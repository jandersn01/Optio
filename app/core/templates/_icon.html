{% comment %}
Ícone padronizado do design system Optio (geometria de icons.jsx: viewBox 24, stroke 1.6).
Fonte única de verdade — sempre use este partial em vez de SVGs inline.
Uso: {% include "_icon.html" with name="trash" size=14 %}
Opcionais: fill (default "none"), style.
{% endcomment %}

<svg
    width="{{ size|default:16 }}"
    height="{{ size|default:16 }}"
    viewBox="0 0 24 24"
    fill="{{ fill|default:'none' }}"
    stroke="currentColor"
    stroke-width="1.6"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
    {% if style %}style="{{ style }}"{% endif %}
>
    {% if name == 'search' %}
        <circle cx="11" cy="11" r="7"/>
        <path d="M20 20l-3.5-3.5"/>

    {% elif name == 'trash' %}
        <path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6M10 11v6M14 11v6"/>

    {% elif name == 'refresh' %}
        <path d="M21 12a9 9 0 11-3-6.7L21 8M21 3v5h-5"/>

    {% elif name == 'external' %}
        <path d="M14 4h6v6M10 14L20 4M19 13v5a2 2 0 01-2 2H6a2 2 0 01-2-2V7a2 2 0 012-2h5"/>

    {% elif name == 'plus' %}
        <path d="M12 5v14M5 12h14"/>

    {% elif name == 'arrow' %}
        <path d="M5 12h14M13 6l6 6-6 6"/>

    {% elif name == 'arrow-left' %}
        <path d="M19 12H5M11 18l-6-6 6-6"/>

    {% elif name == 'chevron-right' %}
        <path d="M9 6l6 6-6 6"/>

    {% elif name == 'chevron-down' %}
        <path d="M6 9l6 6 6-6"/>

    {% elif name == 'bell' %}
        <path d="M6 8a6 6 0 1112 0c0 7 3 8 3 8H3s3-1 3-8zM10 21a2 2 0 004 0"/>

    {% elif name == 'bookmark' %}
        <path d="M6 4h12v17l-6-4-6 4V4z"/>

    {% elif name == 'sparkles' %}
        <path d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5L12 3z"/>

    {% elif name == 'check' %}
        <path d="M5 13l4 4L19 7"/>

    {% elif name == 'x' %}
        <path d="M6 6l12 12M18 6L6 18"/>

    {% elif name == 'mail' %}
        <rect x="3" y="5" width="18" height="14" rx="2"/>
        <path d="M3 7l9 6 9-6"/>

    {% elif name == 'calendar' %}
        <rect x="3" y="5" width="18" height="16" rx="2"/>
        <path d="M3 9h18M8 3v4M16 3v4"/>

    {% elif name == 'home' %}
        <path d="M4 11l8-7 8 7v8a1 1 0 01-1 1h-4v-6h-6v6H5a1 1 0 01-1-1v-8z"/>

    {% elif name == 'list' %}
        <path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>

    {% elif name == 'settings' %}
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 01-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 01-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 01-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 010-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 012.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 014 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 012.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 010 4h-.1a1.7 1.7 0 00-1.5 1z"/>

    {% elif name == 'logout' %}
        <path d="M15 4h3a2 2 0 012 2v12a2 2 0 01-2 2h-3M10 17l5-5-5-5M15 12H4"/>

    {% elif name == 'activity' %}
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
    {% endif %}
</svg>
