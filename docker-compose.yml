
services:
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile  
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./app:/app
    ports:
      - "8000:8000"
    env_file:
      - .env

  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile 
    volumes:
      - ./worker:/worker
    env_file:
      - .env
    depends_on:
      - web
      - rabbitmq

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password

  rabbitmq:
    image: rabbitmq:3-management
    ports:
    - "5672:5672"
    - "15672:15672"
    

volumes:
  postgres_data: